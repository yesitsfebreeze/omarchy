<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Departure Mono as the system UI font too. `omarchy font set` owns
     ../fonts.conf (monospace) and rewrites it, so sans-serif/serif live here. -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DepartureMono Nerd Font</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>DepartureMono Nerd Font</string></edit>
  </match>
</fontconfig>
