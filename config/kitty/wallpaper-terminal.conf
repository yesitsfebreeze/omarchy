# The wallpaper terminal (bin/wallpaper-terminal): Omarchy's theme colours and
# its wallpaper, blurred by bin/wallpaper-terminal. tmux owns everything else, so
# kitty keeps no shortcuts but Omarchy's universal copy/paste.
# `omarchy theme set` reloads it (SIGUSR1).
include ~/.local/state/omarchy/current/theme/kitty.conf

font_family DepartureMono Nerd Font
font_size 14
window_padding_width 0

background_image ~/.cache/wallpaper-terminal/current
background_image_layout cscaled
background_tint 0.7

allow_remote_control socket-only
confirm_os_window_close 0
enable_audio_bell no

clear_all_shortcuts yes
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
